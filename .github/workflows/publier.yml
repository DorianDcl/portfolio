# Reconstruit et publie le site à chaque modification enregistrée sur GitHub.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    name: Construire le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que la version objectif (fictive) n'est pas dans le dépôt
        run: |
          if [ -e objectif ]; then
            echo "## ❌ Publication bloquée" >> "$GITHUB_STEP_SUMMARY"
            echo "Le dossier objectif/ (version FICTIVE) se trouve sur GitHub, où tout le monde peut le lire. Supprime-le tout de suite du dépôt : il doit rester uniquement sur ton ordinateur." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: outils/requirements.txt
      - name: Installer les outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          pip install -r outils/requirements.txt
      - name: Construire le site (et vérifier le contenu)
        run: python outils/construire.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    name: Mettre en ligne
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
